# TIES-merge two fine-tunes into their shared base (mergekit-style), then trim the stack.
base: ./Mistral-7B-v0.1
models:
  math: ./MetaMath-Mistral-7B
  code: ./Mistral-7B-Code
seed: 0
output: ./merged
steps:
  - op: merge
    method: dare_ties
    density: 0.5
    sources:
      - {model: math, weight: 0.6}
      - {model: code, weight: 0.4}
  - op: drop_layers
    layers: "28-30"
